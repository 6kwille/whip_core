<!doctype html>
<html><head><meta charset="utf-8"><title>whip map bake</title></head>
<body>
<!-- Opened by bake.js in headless Chrome: bake(url) recolours one atlas tile and answers a WebP. -->
<script src="whipify.js"></script>
<script>
const cv = document.createElement('canvas');
cv.width = cv.height = 256;
const g = cv.getContext('2d', { willReadFrequently: true });
window.bake = (url) => new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
        g.clearRect(0, 0, 256, 256);
        g.drawImage(img, 0, 0);
        const d = g.getImageData(0, 0, 256, 256);
        whipify(d.data);
        g.putImageData(d, 0, 0);
        resolve(cv.toDataURL('image/webp', 0.9));
    };
    img.onerror = () => reject(new Error('could not load ' + url));
    img.src = url;
});
</script>
</body></html>
